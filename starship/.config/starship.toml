# Starship prompt — cross-shell, Rust-based, TOML config
# https://starship.rs
# Theme: Catppuccin Macchiato
#
# Use named colors from the palette below instead of hex codes.
# "mauve", "peach", "blue", etc. all resolve to Catppuccin Macchiato hex values.

palette = "catppuccin_macchiato"

# Left side: dir → git → languages → duration → newline → prompt char
# Each $variable is a "module". Starship only renders a module if it's relevant
# (e.g. $python only shows when there's a .py or pyproject.toml in the dir).
format = """
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$rust\
$golang\
$terraform\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Right side: clock
right_format = """$time"""

# --- Prompt character ---
# The symbol you type after. Mauve "❯" normally, turns red after a failed command.
[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"

# --- Directory ---
# Shows current path, truncated to 3 levels. "…/" indicates truncation.
[directory]
truncation_symbol = "…/"
style = "bold blue"

[git_branch]
symbol = "󰘬 "
style = "bold mauve"

# --- Git status ---
# Compact symbols showing the state of your working tree.
# Example: ⇡2 !3 +1 means 2 commits ahead, 3 modified files, 1 staged file.
[git_status]
style = "bold peach"
ahead = "⇡${count}"           # commits ahead of remote
behind = "⇣${count}"          # commits behind remote
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"       # merge conflicts
untracked = "?${count}"        # new files not tracked
stashed = "*${count}"          # stashed changes
modified = "!${count}"         # changed but not staged
staged = "+${count}"           # staged for commit
deleted = "✘${count}"          # deleted files

# --- Git metrics ---
# Shows +lines/-lines changed (like a mini diff stat).
[git_metrics]
disabled = false

# --- Command duration ---
# Shows how long a command took, but only if it exceeded 2 seconds.
[cmd_duration]

# --- Time ---
# 24-hour clock on the right side of the prompt.
# Change to "%I:%M %p" for 12-hour format.
[time]
disabled = false
style = "dimmed text"
time_format = "%H:%M"

# --- Opt-in modules (uncomment to enable) ---
# Prevents deploying to the wrong cloud account / k8s cluster.
# [aws]
# style = "bold peach"
# [kubernetes]
# disabled = false
# style = "bold blue"
# [container]
# style = "bold red"

# --- Catppuccin Macchiato color palette ---
# https://github.com/catppuccin/catppuccin
# These names can be used anywhere a "style" accepts a color.
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
