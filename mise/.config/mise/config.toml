# A dependable Node baseline for ad-hoc `npx` commands. Individual projects
# can override it in their own mise.toml or .mise.toml.
[tools]
node = "lts"

# Agent skills CLI (github.com/vercel-labs/skills). Installed through mise's
# npm backend rather than `npm install -g` so the binary is shimmed onto PATH
# independently of the active Node version — a node upgrade would otherwise
# strip a globally installed binary out of its version-specific prefix.
"npm:skills" = "latest"
