# tmux config -- minimal, modern, Catppuccin Macchiato themed
# XDG path: ~/.config/tmux/tmux.conf (tmux 3.1+)

# ─── Prefix ───────────────────────────────────────────────
# ctrl-a is one-handed and a classic GNU screen binding
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ──────────────────────────────────────────────
set -g mouse on                       # click panes, resize, scroll
set -g base-index 1                   # windows start at 1 (not 0)
setw -g pane-base-index 1             # panes also start at 1
set -g renumber-windows on            # re-number when a window closes
set -g set-clipboard on               # use system clipboard via OSC 52
set -g history-limit 50000            # generous scrollback
set -sg escape-time 0                 # no delay on escape (important for vim)
set -g focus-events on                # pass focus events to apps (vim autoread)
set -g detach-on-destroy off          # switch to another session instead of detaching

# ─── True Color ───────────────────────────────────────────
# Tell tmux the terminal outside supports 256 colors and true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Allow passthrough for image previews (yazi, sixel, kitty graphics)
set -g allow-passthrough on

# ─── Splits ───────────────────────────────────────────────
# | and - are intuitive -- they look like what they do
# Open new splits in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also inherit the current directory
bind c new-window -c "#{pane_current_path}"

# ─── Navigation ──────────────────────────────────────────
# vim-style pane switching: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Copy Mode (vi) ──────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── Quick Reload ─────────────────────────────────────────
# prefix + r to reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ─── Catppuccin Macchiato Status Bar ─────────────────────
# Colors: base=#24273a surface0=#363a4f text=#cad3f5
#         blue=#8aadf4 green=#a6da95 mauve=#c6a0f6 yellow=#eed49f

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#24273a,fg=#cad3f5"

# Left: session name in blue
set -g status-left "#[bg=#8aadf4,fg=#24273a,bold] #S #[bg=#24273a] "
set -g status-left-length 30

# Right: date and time
set -g status-right "#[fg=#494d64]│ #[fg=#cad3f5]%a %d %b #[fg=#494d64]│ #[fg=#8aadf4,bold]%H:%M "
set -g status-right-length 50

# Window tabs
set -g window-status-format "#[fg=#6e738d] #I:#W "
set -g window-status-current-format "#[bg=#363a4f,fg=#c6a0f6,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"

# Message/command prompt styling
set -g message-style "bg=#363a4f,fg=#cad3f5"
