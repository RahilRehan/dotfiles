# atuin — shell history stored in SQLite with fuzzy search
# https://github.com/atuinsh/atuin
#
# Press ctrl-r to open the interactive history search.
# Type to fuzzy-filter. Arrow keys to navigate. Enter to execute.

# Compact shows more results per screen (default: "auto")
style = "compact"

# Don't sync history to Atuin's cloud (privacy). Enable later if you want cross-machine sync.
sync_address = ""
auto_sync = false

# Store history per-directory context so you can filter by "commands I ran here"
filter_mode_shell_up_key_binding = "directory"

# Don't record commands that contain secrets/tokens
history_filter = [
    "^export (AWS_SECRET|TOKEN|PASSWORD|KEY|SECRET)=",
    "^curl.*(-H|--header).*[Aa]uthorization",
]
